function extractWords(){
  const text = document.getElementById('engImportText').value;
  if(!text.trim()) return toast(LANG==='zh'?'请先粘贴或导入文本':'Paste or import text first');
  const existing = new Set([...DEFAULT_WORDS.map(w=>w.word.toLowerCase()), ...Store.get('customWords',[]).map(w=>w.word.toLowerCase())]);
  // Extract English words (at least 3 letters, alphabetic)
  const words = text.toLowerCase().match(/[a-z]{3,}/gi) || [];
  // Frequency count
  const freq = {};
  words.forEach(w => { freq[w] = (freq[w]||0) + 1; });
  // Sort by frequency, filter out common stop words
  const stopWords = new Set(['the','and','for','are','but','not','you','all','can','had','her','was','one','our','out','day','get','has','him','his','how','man','new','now','old','see','two','way','who','boy','did','its','let','put','say','she','too','use','that','this','with','from','they','have','been','will','your','just','about','there','when','which','their','what','then','them','into','than','also','only','over','such','take','come','make','like','time','very','more','some','these','would','could','should','would','each','does','because','other','people','think','after','before','while','being','where','through','between','under','again','further','once','here','any','own','same','so','both','few','most','than','too','very','can','will','just','don','now']);
  const sorted = Object.entries(freq).sort((a,b)=>b[1]-a[1]).map(x=>x[0]).filter(w => !stopWords.has(w) && !existing.has(w));
  if(!sorted.length) return toast(LANG==='zh'?'没有新单词可添加':'No new words to add');
  const newWords = sorted.slice(0, 15).map(w => ({
    word: w,
    phonetic: '',
    def: LANG==='zh'?'从导入文本提取的单词':'Extracted from import',
    ex: findExample(text, w),
    fromImport: true,
    date: new Date().toISOString().slice(0,10)
  }));
  const all = [...Store.get('customWords',[]), ...newWords];
  Store.set('customWords', all);
  wordIdx = getAllWords().length - newWords.length;
  renderPage('english');
  toast('✨ ' + (LANG==='zh'?'已添加 '+newWords.length+' 个新单词':'Added '+newWords.length+' new words'));
}
function findExample(text, word){
  const re = new RegExp('[^.!?]*\\b' + word.replace(/[.*+?^${}()|[\]\\]/g,'\\$&') + '\\b[^.!?]*', 'i');
  const m = text.match(re);
  if(m) return m[0].trim().slice(0, 120);
  return '';
}
function extractAndAddSentences(){
  const text = document.getElementById('engImportText').value;
  if(!text.trim()) return toast(LANG==='zh'?'请先粘贴或导入文本':'Paste or import text first');
  // Split by sentence-ending punctuation
  const sentences = text.match(/[^.!?\n]+[.!?]+/g) || [];
  // Filter: must have at least 8 words, all alphabetic content
  const valid = sentences.map(s => s.trim()).filter(s => {
    const words = s.split(/\s+/).filter(w => /[a-zA-Z]/.test(w));
    return words.length >= 6 && words.length <= 30;
  });
  if(!valid.length) return toast(LANG==='zh'?'没有可提取的句子':'No valid sentences found');
  const existing = new Set([...DEFAULT_SENTENCES, ...Store.get('customSentences',[])]);
  const newSents = valid.filter(s => !existing.has(s)).slice(0, 10);
  if(!newSents.length) return toast(LANG==='zh'?'句子都已存在':'All sentences already exist');
  const all = [...Store.get('customSentences',[]), ...newSents];
  Store.set('customSentences', all);
  renderPage('english');
  toast('🗣️ ' + (LANG==='zh'?'已添加 '+newSents.length+' 个句子':'Added '+newSents.length+' sentences'));
}

    <div style="display:flex;gap:8px;justify-content:flex-end"><button class="btn btn-ghost" onclick="closeModal()">取消</button>
    <button class="btn btn-primary" onclick="saveItem('${key}')">保存</button></div>`);
}
function saveItem(key){
  const txt=document.getElementById('itemText').value.trim();
  if(!txt) return toast('请输入内容');
  const a=Store.get(key,[]); a.unshift(txt); Store.set(key,a); closeModal(); renderPage('review2'); toast('已添加');
}
function delItem(key,i){ const a=Store.get(key,[]); a.splice(i,1); Store.set(key,a); renderPage('review2'); }
function saveReflection(){
  const v=document.getElementById('reflectionInput').value;
  Store.set('reflection',v); Store.set('reflectionDate',new Date().toLocaleString());
  renderPage('review2'); toast('💭 反思已保存');
}

/* 日历切换月（实现） */
function changeMonth(delta){
  if(!_calYM){ _calYM = { year: new Date().getFullYear(), month: new Date().getMonth() }; }
  _calYM.month += delta;
  while(_calYM.month < 0){ _calYM.month += 12; _calYM.year--; }
  while(_calYM.month > 11){ _calYM.month -= 12; _calYM.year++; }
  renderPage('daily');
}

/* 首次启动 */
initApp();
</script>
