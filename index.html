<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>成长工作台 · Growth Workspace</title>
<style>
/* ====== 基础重置 ====== */
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;width:100%;overflow:hidden;font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei","Segoe UI",sans-serif}
button,input,textarea,select{font-family:inherit;outline:none;border:none;background:none}
button{cursor:pointer}
::-webkit-scrollbar{width:6px;height:6px}
::-webkit-scrollbar-thumb{background:var(--border);border-radius:3px}
::-webkit-scrollbar-track{background:transparent}

/* ====== 6套清新主题 ====== */
:root{
  --sidebar:#5b7a6d; --sidebar-hover:#6e9182; --sidebar-active:#4a695c;
  --bg:linear-gradient(135deg,#eef7f0 0%,#e0f2e6 50%,#e8f5eb 100%);
  --card:#ffffff; --card-hover:#f9fdfa;
  --accent:#6aaf8a; --accent-soft:#e3f2e8; --accent-deep:#4a8a68;
  --text:#2d3a32; --text-soft:#5a6b60; --text-mute:#8a9a90;
  --border:#ddebe1;
  --shadow:0 4px 20px rgba(106,175,138,.08);
  --shadow-hover:0 8px 30px rgba(106,175,138,.13);
  --radius:16px; --radius-sm:10px; --nav-w:220px;
  --grad:linear-gradient(135deg,#a8e0bf 0%,#6aaf8a 100%);
  --chart-grad:linear-gradient(180deg,#8ed8a8 0%,#4a8a68 100%);
  --ring-stroke:#6aaf8a;
}
/* 护眼模式叠加 */
body.eye-care{
  --sidebar:#6e6652; --sidebar-hover:#8a7f62; --sidebar-active:#5a5340;
  --bg:#f5f0e1; --card:#fcf8ec; --card-hover:#f9f3e2;
  --accent:#8a7a50; --accent-soft:#ece3c8; --accent-deep:#6e6238;
  --text:#3a3420; --text-soft:#6a6048; --text-mute:#8a8068;
  --border:#e0d8c0;
  --shadow:0 4px 20px rgba(106,98,64,.08);
  --shadow-hover:0 8px 30px rgba(106,98,64,.12);
  --grad:linear-gradient(135deg,#c8b888 0%,#8a7a50 100%);
  --chart-grad:linear-gradient(180deg,#b8a870 0%,#6e6238 100%);
  --ring-stroke:#8a7a50;
}
/* 桃粉 Peach */
[data-theme="peach"]{
  --sidebar:#c4837f; --sidebar-hover:#d49592; --sidebar-active:#a06460;
  --bg:linear-gradient(135deg,#fff0ef 0%,#fde2e0 50%,#fce8e6 100%);
  --card:#ffffff; --card-hover:#fff9f8;
  --accent:#e07878; --accent-soft:#fae3e3; --accent-deep:#b85555;
  --text:#3a2a2a; --text-soft:#6a5a5a; --text-mute:#9a8a8a;
  --border:#f2d8d8;
  --shadow:0 4px 20px rgba(224,120,120,.08);
  --shadow-hover:0 8px 30px rgba(224,120,120,.13);
  --grad:linear-gradient(135deg,#f5b0b0 0%,#e07878 100%);
  --chart-grad:linear-gradient(180deg,#f0a0a0 0%,#b85555 100%);
  --ring-stroke:#e07878;
}
/* 海盐蓝 Ocean */
[data-theme="ocean"]{
  --sidebar:#5c7e9a; --sidebar-hover:#7092b0; --sidebar-active:#456580;
  --bg:linear-gradient(135deg,#eaf3fb 0%,#dce8f5 50%,#e4f0fa 100%);
  --card:#ffffff; --card-hover:#fafdff;
  --accent:#5a90c0; --accent-soft:#e0ecf7; --accent-deep:#3d6e99;
  --text:#2a3a4a; --text-soft:#5a6a7a; --text-mute:#8a9aa0;
  --border:#d0e0ee;
  --shadow:0 4px 20px rgba(90,144,192,.08);
  --shadow-hover:0 8px 30px rgba(90,144,192,.13);
  --grad:linear-gradient(135deg,#9cc0e0 0%,#5a90c0 100%);
  --chart-grad:linear-gradient(180deg,#80b0d0 0%,#3d6e99 100%);
  --ring-stroke:#5a90c0;
}
/* 奶油黄 Butter */
[data-theme="butter"]{
  --sidebar:#9a8440; --sidebar-hover:#b09950; --sidebar-active:#7a6830;
  --bg:linear-gradient(135deg,#fffaea 0%,#fcf0d0 50%,#fdf6e0 100%);
  --card:#ffffff; --card-hover:#fffdf5;
  --accent:#d4a848; --accent-soft:#fef5d0; --accent-deep:#a48030;
  --text:#3a3018; --text-soft:#6a5a30; --text-mute:#9a8a60;
  --border:#f0e4c0;
  --shadow:0 4px 20px rgba(212,168,72,.08);
  --shadow-hover:0 8px 30px rgba(212,168,72,.13);
  --grad:linear-gradient(135deg,#e8d080 0%,#d4a848 100%);
  --chart-grad:linear-gradient(180deg,#e0c060 0%,#a48030 100%);
  --ring-stroke:#d4a848;
}
/* 薰衣雾 Lavender */
[data-theme="lavender"]{
  --sidebar:#8a7a9a; --sidebar-hover:#a090b4; --sidebar-active:#6e5f80;
  --bg:linear-gradient(135deg,#f5f0fa 0%,#ece5f5 50%,#f2ecf8 100%);
  --card:#ffffff; --card-hover:#fcfaff;
  --accent:#a890c8; --accent-soft:#ede5f8; --accent-deep:#846aa0;
  --text:#2d2540; --text-soft:#5a5070; --text-mute:#8a80a0;
  --border:#e2d8f0;
  --shadow:0 4px 20px rgba(168,144,200,.08);
  --shadow-hover:0 8px 30px rgba(168,144,200,.13);
  --grad:linear-gradient(135deg,#c8b8e8 0%,#a890c8 100%);
  --chart-grad:linear-gradient(180deg,#b8a8d8 0%,#846aa0 100%);
  --ring-stroke:#a890c8;
}
/* 蜜瓜橙 Melon */
[data-theme="melon"]{
  --sidebar:#c08060; --sidebar-hover:#d49270; --sidebar-active:#9a6448;
  --bg:linear-gradient(135deg,#fff2e8 0%,#fce5d0 50%,#fdead8 100%);
  --card:#ffffff; --card-hover:#fffaf5;
  --accent:#e88850; --accent-soft:#fde8d8; --accent-deep:#b86030;
  --text:#3a2818; --text-soft:#6a5038; --text-mute:#9a8068;
  --border:#f0dcc0;
  --shadow:0 4px 20px rgba(232,136,80,.08);
  --shadow-hover:0 8px 30px rgba(232,136,80,.13);
  --grad:linear-gradient(135deg,#f5b080 0%,#e88850 100%);
  --chart-grad:linear-gradient(180deg,#f0a070 0%,#b86030 100%);
  --ring-stroke:#e88850;
}
/* 薄荷冰 Mint */
[data-theme="mint"]{
  --sidebar:#5a9a8a; --sidebar-hover:#70b0a0; --sidebar-active:#408070;
  --bg:linear-gradient(135deg,#eaf8f4 0%,#d8f0e8 50%,#e4f4ef 100%);
  --card:#ffffff; --card-hover:#fafffd;
  --accent:#50b8a0; --accent-soft:#e0f5f0; --accent-deep:#308a78;
  --text:#1a3a38; --text-soft:#4a6a68; --text-mute:#7a9a98;
  --border:#d0ece5;
  --shadow:0 4px 20px rgba(80,184,160,.08);
  --shadow-hover:0 8px 30px rgba(80,184,160,.13);
  --grad:linear-gradient(135deg,#80d8c8 0%,#50b8a0 100%);
  --chart-grad:linear-gradient(180deg,#70d0c0 0%,#308a78 100%);
  --ring-stroke:#50b8a0;
}

/* ====== 布局 ====== */
body{background:var(--bg);color:var(--text);position:relative}
.bg-custom{position:fixed;inset:0;z-index:-2;background-size:cover;background-position:center;background-attachment:fixed}
.bg-video{position:fixed;inset:0;z-index:-2;width:100%;height:100%;object-fit:cover}
.bg-mask{position:fixed;inset:0;z-index:-1;background:rgba(255,255,255,.55);backdrop-filter:blur(3px)}
body.eye-care .bg-mask{background:rgba(245,240,225,.7)}
.app{display:flex;height:100vh}
.sidebar{width:var(--nav-w);min-width:var(--nav-w);background:var(--sidebar);display:flex;flex-direction:column;color:#fff;transition:background .4s;position:relative;z-index:1}
.brand{padding:20px 16px;text-align:center;border-bottom:1px solid rgba(255,255,255,.1)}
.brand-logo{font-size:28px;margin-bottom:6px}
.brand-name{font-size:15px;font-weight:700}
.brand-sub{font-size:11px;opacity:.7;margin-top:4px}
.nav{flex:1;overflow-y:auto;padding:12px 8px}
.nav-item{display:flex;align-items:center;gap:10px;padding:10px 12px;border-radius:var(--radius-sm);color:rgba(255,255,255,.75);font-size:13px;transition:all .25s;margin-bottom:4px;text-align:left;width:100%}
.nav-item:hover{background:rgba(255,255,255,.08);color:#fff}
.nav-item.active{background:var(--accent);color:#fff;box-shadow:0 4px 12px rgba(0,0,0,.2)}
.nav-item .icon{font-size:18px;width:22px;text-align:center}
.side-foot{padding:10px;border-top:1px solid rgba(255,255,255,.1);display:flex;flex-direction:column;gap:8px}
.sf-row{display:flex;gap:5px;justify-content:center;flex-wrap:wrap}
.sf-label{font-size:11px;opacity:.7;text-align:center}
.theme-dot{width:22px;height:22px;border-radius:50%;cursor:pointer;border:2px solid transparent;transition:all .2s}
.theme-dot:hover{transform:scale(1.15)}
.theme-dot.active{border-color:#fff;box-shadow:0 0 0 2px rgba(255,255,255,.3)}
.theme-dot[data-t="green"]{background:linear-gradient(135deg,#a8e0bf,#4a8a68)}
.theme-dot[data-t="peach"]{background:linear-gradient(135deg,#f5b0b0,#b85555)}
.theme-dot[data-t="ocean"]{background:linear-gradient(135deg,#9cc0e0,#3d6e99)}
.theme-dot[data-t="butter"]{background:linear-gradient(135deg,#e8d080,#a48030)}
.theme-dot[data-t="lavender"]{background:linear-gradient(135deg,#c8b8e8,#846aa0)}
.theme-dot[data-t="melon"]{background:linear-gradient(135deg,#f5b080,#b86030)}
.theme-dot[data-t="mint"]{background:linear-gradient(135deg,#80d8c8,#308a78)}
.side-btn{font-size:10px;padding:5px 8px;border-radius:8px;background:rgba(255,255,255,.12);color:#fff;cursor:pointer;transition:all .25s;border:1px solid rgba(255,255,255,.2)}
.side-btn:hover{background:rgba(255,255,255,.2)}
.side-btn.on{background:var(--accent);border-color:var(--accent)}
.content{flex:1;overflow-y:auto;padding:28px 32px;position:relative;z-index:1}
.page{display:none;animation:fadeUp .4s ease}
.page.active{display:block}
@keyframes fadeUp{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}
.page-head{margin-bottom:24px}
.page-title{font-size:26px;font-weight:800;display:flex;align-items:center;gap:10px}
.page-title .emoji{font-size:30px}
.page-sub{font-size:13px;color:var(--text-mute);margin-top:6px}
.card{background:var(--card);border-radius:var(--radius);padding:20px;box-shadow:var(--shadow);margin-bottom:18px;transition:all .3s}
.card:hover{box-shadow:var(--shadow-hover)}
.card-title{font-size:15px;font-weight:700;margin-bottom:14px;display:flex;align-items:center;gap:8px}
.card-title .dot{width:4px;height:16px;background:var(--accent);border-radius:2px}
.card-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:14px;flex-wrap:wrap;gap:8px}
.card-head .card-title{margin-bottom:0}
.btn{padding:8px 16px;border-radius:var(--radius-sm);font-size:13px;font-weight:600;cursor:pointer;transition:all .25s;display:inline-flex;align-items:center;gap:6px}
.btn-primary{background:var(--accent);color:#fff}
.btn-primary:hover{transform:translateY(-1px);box-shadow:0 4px 12px var(--accent-soft)}
.btn-ghost{background:transparent;color:var(--accent);border:1px solid var(--accent)}
.btn-soft{background:var(--accent-soft);color:var(--accent)}
.btn-sm{padding:5px 10px;font-size:12px}
.btn-danger{background:#e74c3c;color:#fff}
.btn-link{color:var(--accent);font-size:12px;text-decoration:underline}
.btn:active{transform:scale(.97)}
.input,.textarea,.select{width:100%;padding:10px 14px;border:1px solid var(--border);border-radius:var(--radius-sm);font-size:13px;background:var(--card);color:var(--text);transition:border .25s}
.input:focus,.textarea:focus,.select:focus{border-color:var(--accent)}
.textarea{min-height:80px;resize:vertical;font-family:inherit}
.input-row{display:flex;gap:8px;margin-top:10px}
.input-row .input{flex:1}
.grid-2{display:grid;grid-template-columns:repeat(2,1fr);gap:18px}
.grid-3{display:grid;grid-template-columns:repeat(3,1fr);gap:18px}
.grid-4{display:grid;grid-template-columns:repeat(4,1fr);gap:14px}
.grid-cols-2-1{display:grid;grid-template-columns:2fr 1fr;gap:18px}
@media(max-width:1100px){.grid-4{grid-template-columns:repeat(2,1fr)}.grid-3{grid-template-columns:repeat(2,1fr)}.grid-cols-2-1{grid-template-columns:1fr}}
@media(max-width:700px){.grid-4,.grid-3,.grid-2{grid-template-columns:1fr}.content{padding:16px}}

/* 环形进度 */
.ring{position:relative;width:120px;height:120px}
.ring svg{transform:rotate(-90deg);width:100%;height:100%}
.ring-bg{fill:none;stroke:var(--border);stroke-width:10}
.ring-fg{fill:none;stroke:var(--ring-stroke);stroke-width:10;stroke-linecap:round;transition:stroke-dashoffset 1s cubic-bezier(.22,.61,.36,1)}
.ring-center{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center}
.ring-num{font-size:26px;font-weight:800;color:var(--accent)}
.ring-lb{font-size:11px;color:var(--text-mute);margin-top:2px}
.ring-sm{width:80px;height:80px}.ring-sm .ring-num{font-size:18px}
.ring-lg{width:150px;height:150px}.ring-lg .ring-num{font-size:34px}
.ring-wrap{display:flex;align-items:center;justify-content:center}

/* 统计卡 */
.stat-cards{display:grid;grid-template-columns:repeat(4,1fr);gap:14px}
.stat-card{background:var(--card);border-radius:var(--radius);padding:18px;box-shadow:var(--shadow);transition:all .3s}
.stat-card:hover{transform:translateY(-3px);box-shadow:var(--shadow-hover)}
.stat-num{font-size:28px;font-weight:800;background:var(--grad);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text}
.stat-lb{font-size:12px;color:var(--text-mute);margin-top:4px}
.stat-icon{font-size:22px;margin-bottom:8px}
@media(max-width:900px){.stat-cards{grid-template-columns:repeat(2,1fr)}}

/* 柱状图 */
.bar-chart{display:flex;align-items:flex-end;gap:12px;height:180px;padding:10px 0}
.bar-col{flex:1;display:flex;flex-direction:column;align-items:center;gap:6px;height:100%;justify-content:flex-end}
.bar-col .bar{width:100%;max-width:32px;background:var(--chart-grad);border-radius:8px 8px 0 0;transition:height 1s cubic-bezier(.22,.61,.36,1);position:relative;overflow:hidden}
.bar-col .bar::after{content:"";position:absolute;top:0;left:0;right:0;height:30%;background:rgba(255,255,255,.25);border-radius:8px 8px 0 0}
.bar-col .bar-val{font-size:11px;color:var(--accent);font-weight:700}
.bar-col .bar-lb{font-size:11px;color:var(--text-mute);margin-top:auto}

/* 列表 */
.list{display:flex;flex-direction:column;gap:8px}
.list-item{padding:12px 14px;border-radius:var(--radius-sm);background:var(--card-hover);display:flex;align-items:center;gap:12px;transition:all .25s;border:1px solid transparent}
.list-item:hover{border-color:var(--border)}
.list-item .li-main{flex:1}
.list-item .li-title{font-size:13px;font-weight:600}
.list-item .li-sub{font-size:11px;color:var(--text-mute);margin-top:3px}
.icon-btn{width:28px;height:28px;border-radius:8px;background:transparent;color:var(--text-mute);display:inline-flex;align-items:center;justify-content:center;font-size:14px;transition:all .2s;border:none}
.icon-btn:hover{background:var(--accent-soft);color:var(--accent)}

/* 待办 */
.todo-item{display:flex;align-items:center;gap:10px;padding:10px 12px;border-radius:var(--radius-sm);background:var(--card-hover);margin-bottom:6px;transition:all .25s}
.todo-item:hover{background:var(--accent-soft)}
.todo-check{width:20px;height:20px;border-radius:50%;border:2px solid var(--border);cursor:pointer;display:flex;align-items:center;justify-content:center;transition:all .25s;flex-shrink:0}
.todo-check:hover{border-color:var(--accent)}
.todo-item.done .todo-check{background:var(--accent);border-color:var(--accent)}
.todo-item.done .todo-check::after{content:"✓";color:#fff;font-size:12px;font-weight:700}
.todo-item.done .todo-text{text-decoration:line-through;color:var(--text-mute)}
.todo-text{flex:1;font-size:13px}
.todo-del{color:#e74c3c;font-size:14px;padding:4px;cursor:pointer;background:none;border:none}

/* 时间轴 */
.timeline{position:relative;padding-left:24px}
.timeline::before{content:"";position:absolute;left:8px;top:0;bottom:0;width:2px;background:var(--border)}
.tl-item{position:relative;padding:10px 0;padding-left:12px}
.tl-item::before{content:"";position:absolute;left:-20px;top:14px;width:10px;height:10px;border-radius:50%;background:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
.tl-item.done::before{background:#27ae60;box-shadow:0 0 0 3px #d5f5e3}
.tl-time{font-size:12px;color:var(--accent);font-weight:600}
.tl-title{font-size:13px;margin-top:3px}
.tl-desc{font-size:11px;color:var(--text-mute);margin-top:2px}

/* 标签 */
.tag{display:inline-block;padding:3px 10px;border-radius:12px;font-size:11px;font-weight:600;background:var(--accent-soft);color:var(--accent)}
.cat-pills{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:14px}
.cat-pill{padding:6px 14px;border-radius:16px;font-size:12px;background:var(--card);border:1px solid var(--border);cursor:pointer;color:var(--text-soft);transition:all .25s}
.cat-pill:hover{border-color:var(--accent);color:var(--accent)}
.cat-pill.active{background:var(--accent);color:#fff;border-color:var(--accent)}

/* 打卡日历 */
.check-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;margin-top:8px}
.check-day{aspect-ratio:1;border-radius:8px;background:var(--card-hover);display:flex;flex-direction:column;align-items:center;justify-content:center;font-size:11px;position:relative}
.check-day.today{border:2px solid var(--accent);font-weight:700}
.check-day.checked{background:var(--accent);color:#fff}
.check-day.checked::after{content:"✓";position:absolute;bottom:2px;font-size:9px}

/* 月历 */
.calendar{display:grid;grid-template-columns:repeat(7,1fr);gap:4px}
.cal-hd{text-align:center;font-size:11px;color:var(--text-mute);padding:6px 0;font-weight:600}
.cal-day{aspect-ratio:1;border-radius:6px;display:flex;align-items:center;justify-content:center;font-size:12px;cursor:pointer;transition:all .2s;background:transparent}
.cal-day:hover{background:var(--accent-soft)}
.cal-day.empty{cursor:default;background:transparent}
.cal-day.other{color:var(--text-mute);opacity:.4}
.cal-day.today{background:var(--accent);color:#fff;font-weight:700}
.cal-day.has-todo::after{content:"";position:absolute;bottom:3px;left:50%;transform:translateX(-50%);width:4px;height:4px;border-radius:50%;background:var(--accent);position:relative;margin-top:-4px;margin-left:2px}
.cal-day.checked-day{background:var(--accent-soft);color:var(--accent);font-weight:600}
.cal-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px}

/* 快捷入口 */
.shortcuts{display:grid;grid-template-columns:repeat(5,1fr);gap:12px}
.shortcut{background:var(--card);border-radius:var(--radius);padding:18px 10px;text-align:center;box-shadow:var(--shadow);cursor:pointer;transition:all .3s}
.shortcut:hover{transform:translateY(-4px);box-shadow:var(--shadow-hover)}
.shortcut .sc-icon{font-size:28px;margin-bottom:8px}
.shortcut .sc-lb{font-size:12px;font-weight:600}
.shortcut .sc-sub{font-size:10px;color:var(--text-mute);margin-top:2px}
@media(max-width:1000px){.shortcuts{grid-template-columns:repeat(3,1fr)}}
@media(max-width:600px){.shortcuts{grid-template-columns:repeat(2,1fr)}}

/* 赛道 */
.track-cards{display:grid;grid-template-columns:repeat(5,1fr);gap:12px;margin-bottom:16px}
.track-card{padding:16px 10px;border-radius:var(--radius);background:var(--card);box-shadow:var(--shadow);cursor:pointer;text-align:center;transition:all .3s;border:2px solid transparent}
.track-card:hover{transform:translateY(-3px)}
.track-card.active{border-color:var(--accent);background:var(--accent-soft)}
.track-emoji{font-size:32px;margin-bottom:6px}
.track-name{font-size:12px;font-weight:600}
@media(max-width:1000px){.track-cards{grid-template-columns:repeat(3,1fr)}}
@media(max-width:600px){.track-cards{grid-template-columns:repeat(2,1fr)}}

/* 课程 */
.course-card{background:var(--card);border-radius:var(--radius);padding:16px;box-shadow:var(--shadow);transition:all .3s;display:flex;gap:14px;align-items:flex-start}
.course-card:hover{transform:translateY(-2px);box-shadow:var(--shadow-hover)}
.course-cover{width:80px;height:60px;border-radius:10px;background:var(--grad);display:flex;align-items:center;justify-content:center;font-size:28px;flex-shrink:0}
.course-info{flex:1}
.course-title{font-size:14px;font-weight:700;margin-bottom:4px}
.course-desc{font-size:11px;color:var(--text-mute);margin-bottom:8px;line-height:1.5}
.progress-bar{height:8px;background:var(--border);border-radius:4px;overflow:hidden;margin:6px 0}
.progress-fill{height:100%;background:var(--grad);border-radius:4px;transition:width .8s}

/* Prompt卡 */
/* 旅行照片画廊 */
.photo-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.photo-grid .grid-span-2{grid-column:span 2}
.travel-photo{position:relative;border-radius:10px;overflow:hidden;cursor:pointer;aspect-ratio:1/1.3}
.travel-photo.grid-span-2{aspect-ratio:2/1.3}
.travel-photo img{width:100%;height:100%;object-fit:cover;transition:transform .4s}
.travel-photo:hover img{transform:scale(1.08)}
.photo-overlay{position:absolute;bottom:0;left:0;right:0;padding:10px 12px;background:linear-gradient(transparent,rgba(0,0,0,.8));color:#fff;opacity:0;transition:opacity .3s}
.travel-photo:hover .photo-overlay{opacity:1}
.photo-loc{font-size:12px;font-weight:700}
.photo-cap{font-size:10px;margin-top:2px;opacity:.9}
@media(max-width:900px){.photo-grid{grid-template-columns:repeat(2,1fr)}.photo-grid .grid-span-2{grid-column:span 1}}

.prompt-card{background:var(--card);border-radius:var(--radius);padding:16px;box-shadow:var(--shadow);transition:all .3s;border-left:4px solid var(--accent);margin-bottom:10px}
.prompt-card:hover{transform:translateY(-2px);box-shadow:var(--shadow-hover)}
.prompt-content{font-size:13px;line-height:1.7;color:var(--text);margin:10px 0;white-space:pre-wrap}

/* 书籍 */
.book-card{background:var(--card);border-radius:var(--radius);padding:14px;box-shadow:var(--shadow);transition:all .3s;display:flex;gap:12px}
.book-card:hover{transform:translateY(-2px);box-shadow:var(--shadow-hover)}
.book-cover{width:60px;height:85px;border-radius:8px;background:var(--grad);display:flex;align-items:center;justify-content:center;font-size:24px;flex-shrink:0;color:#fff}
.book-info{flex:1}
.book-title{font-size:14px;font-weight:700}
.book-author{font-size:11px;color:var(--text-mute);margin-top:2px}

/* 弹窗 */
.modal-mask{position:fixed;inset:0;background:rgba(0,0,0,.4);display:none;align-items:center;justify-content:center;z-index:1000;padding:20px}
.modal-mask.show{display:flex}
.modal{background:var(--card);border-radius:var(--radius);padding:24px;max-width:560px;width:100%;max-height:80vh;overflow-y:auto;box-shadow:0 20px 60px rgba(0,0,0,.2);animation:modalIn .25s ease}
@keyframes modalIn{from{opacity:0;transform:scale(.95)}to{opacity:1;transform:scale(1)}}
.modal-title{font-size:17px;font-weight:700;margin-bottom:16px}

/* Toast */
.toast{position:fixed;bottom:30px;left:50%;transform:translateX(-50%) translateY(20px);background:rgba(0,0,0,.85);color:#fff;padding:10px 22px;border-radius:24px;font-size:13px;opacity:0;transition:all .3s;pointer-events:none;z-index:2000}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}

/* 进度条/选项 */
.option-list{display:flex;flex-direction:column;gap:8px}
.option-item{padding:12px;border-radius:var(--radius-sm);background:var(--card-hover);cursor:pointer;transition:all .25s;border:2px solid transparent;display:flex;justify-content:space-between;align-items:center}
.option-item:hover{border-color:var(--accent)}
.option-item.selected{border-color:var(--accent);background:var(--accent-soft)}
.option-key{font-weight:600;color:var(--accent)}
.empty{text-align:center;padding:40px 20px;color:var(--text-mute)}
.empty .emo{font-size:40px;display:block;margin-bottom:10px}
.word-card{background:var(--card);border-radius:var(--radius);padding:30px;text-align:center;box-shadow:var(--shadow)}
.word-main{font-size:36px;font-weight:800;color:var(--accent);margin-bottom:6px}
.word-phonetic{font-size:14px;color:var(--text-mute);font-style:italic;margin-bottom:14px}
.word-def{font-size:14px;color:var(--text);line-height:1.7}
.word-example{margin-top:14px;padding:12px;background:var(--accent-soft);border-radius:var(--radius-sm);font-size:13px;color:var(--text-soft);font-style:italic}

/* Tabs */
.tabs{display:flex;gap:4px;background:var(--card-hover);padding:4px;border-radius:var(--radius-sm);margin-bottom:16px;width:fit-content}
.tab{padding:6px 16px;border-radius:var(--radius-sm);font-size:12px;cursor:pointer;color:var(--text-soft);transition:all .25s;font-weight:600}
.tab.active{background:var(--card);color:var(--accent);box-shadow:var(--shadow)}

/* 还款 */
.loan-card{background:var(--card);border-radius:var(--radius);padding:16px;box-shadow:var(--shadow);border-left:4px solid var(--accent);margin-bottom:10px}
.loan-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px}
.loan-name{font-size:15px;font-weight:700}
.loan-amount{font-size:18px;font-weight:800;color:var(--accent)}

/* 阅读器 */
.reader-modal .modal{max-width:720px;max-height:85vh}
.reader-content{font-size:15px;line-height:2;color:var(--text);white-space:pre-wrap;padding:10px 4px}
.reader-toolbar{display:flex;gap:6px;align-items:center;margin-bottom:12px;flex-wrap:wrap}

/* MBTI/星座卡 */
.prediction-card{background:var(--grad);border-radius:var(--radius);padding:22px;color:#fff;margin-bottom:16px;box-shadow:var(--shadow-hover)}
.pred-card-title{font-size:13px;opacity:.9;margin-bottom:8px}
.pred-card-num{font-size:32px;font-weight:800}
.pred-text{font-size:13px;line-height:1.8;margin-top:10px}

/* 响应式 */
@media(max-width:900px){
  .sidebar{width:60px;min-width:60px}
  .brand-name,.brand-sub,.nav-item .icon + *,.sf-label,.sf-row{display:none}
  .nav-item{justify-content:center;padding:10px}
  .nav-item .icon{font-size:22px}
  .content{padding:16px}
}

<script>
/* ========== 国际化词典 ========== */
const I18N = {

    hello:'Have a productive day!', done:'Done', total:'Total', checkin:'Check-in',
    plan:'Plan', todo:'To-do', habit:'Habit', progress:'Progress', note:'Note',
    today:'Today', week:'Week', month:'Month', year:'Year', rate:'Rate', minutes:'min',
  }
};
let LANG = 'zh';
function t(k){
  const keys = k.split('.');
  let v = I18N[LANG];
  for(const key of keys){ v = v?.[key]; }
  return v ?? k;
}

/* ========== 导航配置 ========== */
const NAV_ICONS = { home:'🏠', daily:'📅', ai:'🤖', video:'🎬',
                    script:'✍️', prompt:'💡', review:'📊',
                    english:'UK', speech:'🎤', book:'📚',
                    podcast:'🎙️', thoughts:'💭', travel:'🌍',
                    accounting:'💰', flow:'📶', timer:'⏱️',
                    loan:'💸', mbti:'🔮', review2:'🔄', usage:'📈', period:'🩸' };
const NAV_KEYS = ['home','daily','ai','video','script','prompt','review','english','speech','book','podcast','thoughts','travel','accounting','flow','timer','loan','mbti','review2','usage','period'];

/* ========== 本地存储 ========== */
const Store = {
  get(k,def){ try{return JSON.parse(localStorage.getItem('pb_'+k)) ?? def}catch(e){return def} },
  set(k,v){ localStorage.setItem('pb_'+k, JSON.stringify(v)) },
  del(k){ localStorage.removeItem('pb_'+k) }
};

/* ========== 初始化 ========== */
function initApp(){
  // 主题
  const th = Store.get('theme', 'green');
  document.body.setAttribute('data-theme', th);
  // 护眼
  if(Store.get('eyeCare', false)) document.body.classList.add('eye-care');
  // 语言
  LANG = Store.get('lang', 'zh');
  // 自定义背景
  const bgImg = Store.get('bgImage', '');
  const bgVid = Store.get('bgVideo', '');
  if(bgImg){ document.getElementById('bgCustom').style.backgroundImage = 'url('+bgImg+')'; }
  if(bgVid){
    const v = document.getElementById('bgVideo');
    v.src = bgVid; v.style.display='block'; v.play().catch(()=>{});
  }
  applyBgFilter();
  // 清理旧的滤镜/模糊参数（用户调过的非默认值会糊屏）
  try {
    var _oldPBF = Store.get('pageBgFilters', null);
    if(_oldPBF){
      var _hasNonDefault = Object.values(_oldPBF).some(function(o){
        return o && (o.blur>0 || o.opacity<100 || o.saturate!==100 || o.brightness!==100);
      });
      if(_hasNonDefault){ Store.set('pageBgFilters', {}); }
    }
  } catch(e){}
  renderThemeDots();
  renderSidebar();
  renderSideButtons();
  renderContent();
  // 书籍数据迁移：过滤掉已删除的旧书(b4/b5/...)，补全新字段
  try {
    var _oldBooks = JSON.parse(localStorage.getItem('pb_books'));
    if (_oldBooks && Array.isArray(_oldBooks)) {
      var _defIds = DEFAULT_BOOKS.map(function(x){ return x.id; });
      var _filtered = _oldBooks.filter(function(b){ return _defIds.indexOf(b.id)>=0; });
      var _changed = (_filtered.length !== _oldBooks.length);
      _filtered.forEach(function(b){
        var def = DEFAULT_BOOKS.find(function(x){ return x.id === b.id; });
        if (!def) return;
        if (def.cover && b.cover !== def.cover) { b.cover = def.cover; _changed = true; }
        if (def.file && !b.file) { b.file = def.file; _changed = true; }
        if (def.author && !b.author) { b.author = def.author; _changed = true; }
        if (def.desc && !b.desc) { b.desc = def.desc; _changed = true; }
        if (def.format && !b.format) { b.format = def.format; _changed = true; }
      });
      // 还没存在的默认书补进来
      _defIds.forEach(function(id){
        if (!_filtered.find(function(b){ return b.id===id; })) {
          _filtered.push(DEFAULT_BOOKS.find(function(x){ return x.id===id; }));
          _changed = true;
        }
      });
      if (_changed) { Store.set('books', _filtered); }
    }
  } catch(_e) {}
  // 启动欢迎页（每次访问都显示，必须选身份）
  setTimeout(function(){ showWelcome(); }, 300);
}
/* ========== 启动欢迎页 ========== */

  genderHtml += '<div style="display:flex;gap:10px;justify-content:center">';
  genderHtml += '<button id="wg_female" class="cat-pill' + (g==='female'?' active':'') + '" onclick="pickWelcomeGender(\'female\')" style="padding:10px 16px;font-size:13px">' + (g==='female'?'✅ ':'') + '👩 ' + (LANG==='zh'?'女生':'Female') + '</button>';

  genderHtml += '</div>';
  var btnDisabled = g ? '' : 'disabled style="opacity:.4;cursor:not-allowed"';
  var html = '<div id="welcomeOverlay" style="position:fixed;inset:0;z-index:9999;background:linear-gradient(135deg,#0c3483,#a2b6df);display:flex;align-items:center;justify-content:center;padding:20px;animation:fadeIn .5s">' +
    '<style>@keyframes fadeIn{from{opacity:0}to{opacity:1}}@keyframes slideUp{from{transform:translateY(20px);opacity:0}to{transform:translateY(0);opacity:1}}#welcomeCard{animation:slideUp .6s ease-out}</style>' +
    '<div id="welcomeCard" style="max-width:420px;width:100%;background:rgba(255,255,255,.97);border-radius:24px;padding:36px 28px;text-align:center;box-shadow:0 20px 60px rgba(0,0,0,.3)">' +
    '<div style="font-size:44px;margin-bottom:8px">🌊</div>' +
    '<div style="font-size:22px;font-weight:800;background:linear-gradient(135deg,#0c3483,#2193b0);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;margin-bottom:4px">' + (LANG==='zh'?'成长工作台 · Growth Space':'Growth Space') + '</div>' +
    '<div style="font-size:12px;color:#888;margin-bottom:18px">' + (LANG==='zh'?'不只是工作，是成为更好的自己':'Not just work, becoming a better you') + '</div>' +
    '<div style="height:1px;background:linear-gradient(90deg,transparent,#ddd,transparent);margin-bottom:18px"></div>' +
    genderHtml +
    '<div style="background:linear-gradient(135deg,#e8f4fd,#f0f8ff);border-radius:12px;padding:16px;margin-bottom:14px">' +
      '<div style="font-size:13px;font-style:italic;color:#1a5276;line-height:1.7">"'+ quote.q +'"</div>' +

    '<button id="welcomeEnterBtn" class="btn btn-primary" ' + btnDisabled + ' onclick="confirmWelcome()">🚀 ' + (LANG==='zh'?'开启我的工作台':'Enter my space') + '</button>' +
    '</div>' +
  '</div>';
  document.body.insertAdjacentHTML('beforeend', html);
}
function pickWelcomeGender(g){
  Store.set('userGender', g);
  document.querySelectorAll('#welcomeGenderArea .cat-pill').forEach(function(b){
    b.classList.remove('active');
    b.style.background = '';
  });
  var btn = document.getElementById('wg_' + g);
  if(btn){
    btn.classList.add('active');
    // re-render checkmark
    document.querySelectorAll('#welcomeGenderArea .cat-pill').forEach(function(b){
      var txt = b.textContent.replace(/^✅\s*/, '');
      if(b.id === 'wg_' + g){ b.textContent = '✅ ' + txt; }
      else { b.textContent = txt; }
    });
  }
  // enable enter button
  var enterBtn = document.getElementById('welcomeEnterBtn');
  if(enterBtn){ enterBtn.disabled = false; enterBtn.style.opacity = ''; enterBtn.style.cursor = ''; }
}
function confirmWelcome(){
  var g = Store.get('userGender', '');
  if(!g){ toast(LANG==='zh'?'请先选身份哦':'Pick identity first'); return; }
  Store.set('welcomeDone', true);
  closeWelcome();
  toast(LANG==='zh'?'欢迎回来 ✨':'Welcome back ✨');
}
function closeWelcome(){
  var el = document.getElementById('welcomeOverlay');
  if(el) el.remove();
}
function showDailyQuote(){
  var quote = DAILY_QUOTES[new Date().getDate() % DAILY_QUOTES.length];
  var html = '<div id="dailyQuoteCard" style="position:fixed;top:20px;right:20px;z-index:999;background:rgba(255,255,255,.97);backdrop-filter:blur(10px);border-radius:12px;padding:14px 18px;box-shadow:0 8px 32px rgba(0,0,0,.15);max-width:260px;font-size:12px;color:#333;animation:slideIn .5s">' +
    '<style>@keyframes slideIn{from{transform:translateX(100%);opacity:0}to{transform:translateX(0);opacity:1}}#dailyQuoteCard .x{float:right;cursor:pointer;color:#aaa;margin-left:8px}</style>' +

    '<div style="font-style:italic;line-height:1.5;color:#1a5276">"'+ quote.q +'"</div>' +

/* ========== 主题 ========== */
function renderThemeDots(){
  const cur = document.body.getAttribute('data-theme');
  const themes = [
    {t:'green', n:'清新绿'},{t:'peach', n:'桃粉'},{t:'ocean', n:'海盐蓝'},
    {t:'butter', n:'奶油黄'},{t:'lavender', n:'薰衣雾'},{t:'melon', n:'蜜瓜橙'},{t:'mint', n:'薄荷冰'}
  ];
  document.getElementById('themeList').innerHTML = themes.map(x=> '<div class="theme-dot' + (x.t===cur?' active':'') + '" data-t="' + (x.t) + '" title="' + (x.n) + '"></div>').join('');
  document.querySelectorAll('.theme-dot').forEach(d=>{
    d.onclick = ()=>{
      document.body.setAttribute('data-theme', d.dataset.t);
      Store.set('theme', d.dataset.t);
      renderThemeDots();
      toast('🎨 主题已切换');
    };
  });
}

/* ========== 侧边栏 ========== */
/* ========== 板块排序/隐藏 ========== */
function getNavKeys(){
  var custom = Store.get('navOrder', null);
  var hidden = Store.get('navHidden', []);
  var gender = Store.get('userGender', '');
  var baseKeys = NAV_KEYS;
  // 女生专属板块：只有 gender==='female' 才显示 period
  if(gender !== 'female'){
    baseKeys = baseKeys.filter(function(k){ return k !== 'period'; });
    // 也从 hidden/order 里移除，避免残留
    hidden = hidden.filter(function(k){ return k !== 'period'; });
    if(custom) custom = custom.filter(function(k){ return k !== 'period'; });
  }
  if(!custom || !Array.isArray(custom)) return baseKeys.filter(function(k){ return hidden.indexOf(k)<0; });
  // 合并：自定义顺序在前 + 新增的默认板块
  var merged = custom.slice();
  baseKeys.forEach(function(k){ if(merged.indexOf(k)<0) merged.push(k); });
  return merged.filter(function(k){ return hidden.indexOf(k)<0; });
}
function moveNavItem(key, dir){
  var order = Store.get('navOrder', NAV_KEYS.slice());
  var idx = order.indexOf(key);

/* 从池子中按日期取 N 个不同元素 */
function pickDaily(pool, n){
  const d = new Date();
  const seed = d.getFullYear()*10000 + (d.getMonth()+1)*100 + d.getDate();
  const len = pool.length;
  const result = [];
  const used = [];
  for(let i=0;i<Math.min(n,len);i++){
    let idx = (seed + i*7) % len;
    while(used.indexOf(idx) >= 0) idx = (idx + 1) % len;
    used.push(idx);
    result.push(pool[idx]);
  }
  return result;
}

function getTodaySpokenTopic(){
  const keys = Object.keys(SPOKEN_SCENES);
  const d = new Date();
  const idx = (d.getFullYear()*10000 + (d.getMonth()+1)*100 + d.getDate()) % keys.length;
  const sceneKey = keys[idx];
  const scene = SPOKEN_SCENES[sceneKey];
  const topicIdx = (d.getDate() + d.getMonth()*3) % scene.topics.length;
  return {sceneKey:sceneKey, scene:scene, topicIdx:topicIdx, topic:scene.topics[topicIdx]};
}

  content.style.background = '';
  content.style.backgroundImage = '';
  content.style.filter = '';

  if(bg){
    if(bg.startsWith('linear-gradient') || bg.startsWith('radial-gradient') || bg.startsWith('#') || bg.startsWith('rgb')){
      content.style.background = bg;
    } else if(bg.startsWith('data:image') || bg.startsWith('http')){
      content.style.backgroundImage = 'url("' + bg + '")';
      content.style.backgroundSize = 'cover';
      content.style.backgroundPosition = 'center';
      content.style.backgroundAttachment = 'fixed';
    }

    var _isDefaultFilter = (pFilter.blur===0 && pFilter.opacity===100 && pFilter.saturate===100 && pFilter.brightness===100);
    if(!_isDefaultFilter){
      content.style.filter = 'blur(' + pFilter.blur + 'px) saturate(' + pFilter.saturate + '%) brightness(' + pFilter.brightness + '%)';
      content.style.opacity = (pFilter.opacity/100).toString();

    document.querySelectorAll('.sidebar, .side-foot').forEach(function(c){ c.style.background = ''; });
    content.style.padding = '';

  trackUsage(pid);
}

let _curThoughtEmoji = '💭';
function setThoughtEmoji(e){ _curThoughtEmoji = e; toast(e + ' ✨'); }
function saveThought(){
  const text = document.getElementById('thoughtText').value.trim();
  if(!text) return toast(LANG==='zh'?'写点什么再保存吧':'Write something first');
  const arr = Store.get('thoughts', []);
  arr.unshift({emoji:_curThoughtEmoji, text:text, date:new Date().toLocaleString()});
  Store.set('thoughts', arr);
  renderPage('thoughts');
  toast('✨ ' + (LANG==='zh'?'已记录':'Saved'));
}
function delThought(i){
  const arr = Store.get('thoughts', []);
  arr.splice(i,1);
  Store.set('thoughts', arr);
  renderPage('thoughts');
  toast(LANG==='zh'?'已删除':'Deleted');
}

let _accCat = 'food'; let _accPay = 'wechat'; let _accPhoto = null; let _accSub = '';
function selectAccCat(btn,k){
  _accCat = k;
  if(k==='other'){
    const subs = Store.get('accSubCats', ['拼多多','剪映充值','豆包续费','APP订阅','网购']);
    if(!_accSub && subs.length) _accSub = subs[0];
  } else { _accSub = ''; }
  renderPage('accounting');
}
function selectAccSub(btn,s){ _accSub = s; document.querySelectorAll('#accSubArea .cat-pill[data-sub]').forEach(function(p){ p.classList.remove('active'); }); btn.classList.add('active'); }
function addAccSub(){
  const inp = document.getElementById('accSubInp');
  if(!inp) return;
  const v = inp.value.trim();
  if(!v) return;
  const subs = Store.get('accSubCats', ['拼多多','剪映充值','豆包续费','APP订阅','网购']);
  if(subs.indexOf(v)<0) subs.push(v);
  Store.set('accSubCats', subs);
  _accSub = v;
  renderPage('accounting');
}
function delAccSub(s){
  const subs = Store.get('accSubCats', ['拼多多','剪映充值','豆包续费','APP订阅','网购']);
  const arr = subs.filter(function(x){ return x!==s; });
  Store.set('accSubCats', arr);
  if(_accSub===s) _accSub = arr[0] || '';
  renderPage('accounting');
}
function selectAccPay(btn,k){ _accPay = k; document.querySelectorAll('#accounting .cat-pill[data-pay]').forEach(function(p){ p.classList.remove('active'); }); btn.classList.add('active'); }
function setAccAmount(v){ document.getElementById('accAmount').value = v; }
function saveAccItem(){
  const amt = parseFloat(document.getElementById('accAmount').value);
  if(!amt || amt<=0) return toast(LANG==='zh'?'请输入有效金额':'Enter amount');
  if(_accCat==='other' && !_accSub){
    const subs = Store.get('accSubCats', []);
    if(subs.length) return toast(LANG==='zh'?'请先选择子分类':'Pick a sub-category');
  }
  const arr = Store.get('accountItems', []);
  arr.push({id:uid(), amount:amt, cat:_accCat, sub:_accSub||'', pay:_accPay, note:document.getElementById('accNote').value.trim(), photo:_accPhoto, date:new Date().toLocaleString()});
  Store.set('accountItems', arr);
  _accPhoto = null;
  renderPage('accounting');
  toast('✅ ¥' + amt.toFixed(2));
}
function delAccItem(id){
  const arr = Store.get('accountItems', []).filter(function(x){ return x.id!==id; });
  Store.set('accountItems', arr);
  renderPage('accounting');
  toast(LANG==='zh'?'已删除':'Deleted');
}
function handleAccPhoto(e){
  const f = e.target.files?.[0]; if(!f) return;
  const reader = new FileReader();
  reader.onload = function(ev){
    _accPhoto = ev.target.result;
    document.getElementById('accPhotoPreview').innerHTML = '<img src="' + _accPhoto + '" style="max-width:120px;border-radius:8px">';
    toast(LANG==='zh'?'照片已附加':'Photo attached');
  };
  reader.readAsDataURL(f);
}
function useVoiceNote(){
  // 提示用户微信/系统语音转文字后粘贴过来，或用浏览器 Web Speech API
  if('webkitSpeechRecognition' in window || 'SpeechRecognition' in window){
    const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
    const rec = new SR(); rec.lang = 'zh-CN';
    rec.onresult = function(ev){
      const text = ev.results[0][0].transcript;
      document.getElementById('accNote').value = text;
      toast('🎙️ ' + (LANG==='zh'?'已识别':'Recognized'));
    };
    rec.onerror = function(){ toast(LANG==='zh'?'语音识别失败':'Voice failed'); };
    rec.start();
    toast(LANG==='zh'?'开始录音...':'Recording...');
  } else {
    toast(LANG==='zh'?'浏览器不支持语音识别，请用微信语音转文字粘贴':'Use WeChat voice-to-text');
  }
}
function exportAccData(){
  const arr = Store.get('accountItems', []);
  if(!arr.length) return toast(LANG==='zh'?'没有数据':'No data');
  const csv = '日期,金额,分类,支付方式,备注\n' + arr.map(function(x){
    const cat = (ACC_CATS.find(function(c){ return c.key===x.cat; })||{}).label||x.cat;
    const pay = (ACC_PAYS.find(function(p){ return p.key===x.pay; })||{}).label||x.pay;
    return [x.date, x.amount, cat, pay, (x.note||'').replace(/,/g,'，')].join(',');
  }).join('\n');
  const blob = new Blob(['\ufeff'+csv], {type:'text/csv'});
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = '记账数据_' + new Date().toISOString().slice(0,10) + '.csv';
  a.click();
  toast('📤 ' + (LANG==='zh'?'已导出':'Exported'));
}

  const hh = String(beijing.getHours()).padStart(2,'0');

  if(clkEl) clkEl.textContent = hh + ':' + mm + ':' + ss;
  if(dateEl){

    const d = String(beijing.getDate()).padStart(2,'0');
    const wd = ['周日','周一','周二','周三','周四','周五','周六'][beijing.getDay()];
    const ap = beijing.getHours() < 12 ? (LANG==='zh'?'上午':'AM') : (LANG==='zh'?'下午':'PM');

/* 切换模式 */
function switchTimerMode(m){
  _tMode = m; _tRunning = false; clearInterval(_tHandle);
  if(m==='stopwatch'){ _tRemain = 0; _tStart = 0; }
  else { _tRemain = _tDur; }
  Store.del('timerState');
  renderPage('timer');
}
/* 预设时长 */
function setTimerPreset(min){
  _tDur = min * 60000; _tRemain = _tDur; _tMode = 'countdown'; _tRunning = false;
  clearInterval(_tHandle);
  Store.del('timerState');
  renderPage('timer');
}
/* 自定义时长 */
function setTimerCustom(){
  const m = parseInt(document.getElementById('timerMin').value) || 0;
  const s = parseInt(document.getElementById('timerSec').value) || 0;
  const total = (m*60 + s) * 1000;
  if(total <= 0) return toast(LANG==='zh'?'请输入有效时间':'Enter valid time');
  _tDur = total; _tRemain = total; _tMode = 'countdown'; _tRunning = false;
  clearInterval(_tHandle);
  Store.del('timerState');
  renderPage('timer');
}
/* 开始/暂停 */
function toggleTimer(){
  if(_tRunning){
    // 暂停
    _tRunning = false; clearInterval(_tHandle);
    if(_tMode==='countdown'){
      // 暂停时保存剩余时间，清 endAt
      const st = Store.get('timerState',{});
      st.mode = _tMode; st.dur = _tDur; st.remain = _tRemain; st.endAt = null;
      Store.set('timerState', st);
    }
    renderTimerBtn();
  } else {
    if(_tMode==='countdown'){
      if(_tRemain <= 0){ toast(LANG==='zh'?'请先设置时长':'Set duration first'); return; }
      // 从暂停恢复 or 全新开始
      const st = Store.get('timerState',{});
      if(st.remain && !st.endAt){ _tRemain = st.remain; }
      Store.set('timerState', { mode:_tMode, dur:_tDur, endAt: Date.now()+_tRemain });
    } else {
      // 正计时
      if(!_tStart) _tStart = Date.now();
      else _tStart = Date.now() - _tRemain; // 从暂停恢复
    }
    _tRunning = true;
    startTimerTick();
    renderTimerBtn();
  }
}
/* 启动 tick */
function startTimerTick(){
  clearInterval(_tHandle);
  _tHandle = setInterval(function(){
    if(_tMode==='countdown'){
      _tRemain = Store.get('timerState',{}).endAt - Date.now();
      if(_tRemain <= 0){
        _tRemain = 0; _tRunning = false; clearInterval(_tHandle);
        Store.del('timerState');
        playTimerDone();
        renderTimerDisplay();
        return;
      }
    } else {
      _tRemain = Date.now() - _tStart;
    }
    renderTimerDisplay();
  }, 200);
}
/* 渲染显示 */
function renderTimerDisplay(){
  const el = document.getElementById('timerDisplay');
  if(!el) return;
  const ms = _tMode==='countdown' ? Math.max(0,_tRemain) : _tRemain;
  const totalSec = Math.floor(ms/1000);
  const hh = String(Math.floor(totalSec/3600)).padStart(2,'0');
  const mm = String(Math.floor((totalSec%3600)/60)).padStart(2,'0');
  const ss = String(totalSec%60).padStart(2,'0');
  el.textContent = hh + ':' + mm + ':' + ss;
}

  const btn = document.getElementById('timerBtn');

/* 时间到提醒 */
function playTimerDone(){
  // 蜂鸣声 + 弹窗
  try{
    const ctx = new (window.AudioContext||window.webkitAudioContext)();
    const notes = [880, 660, 880, 660, 880];
    notes.forEach(function(f,i){
      const osc = ctx.createOscillator();
      const gain = ctx.createGain();
      osc.connect(gain); gain.connect(ctx.destination);
      osc.frequency.value = f; osc.type = 'sine';
      gain.gain.setValueAtTime(0.001, ctx.currentTime + i*0.25);
      gain.gain.exponentialRampToValueAtTime(0.3, ctx.currentTime + i*0.25 + 0.05);
      gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + i*0.25 + 0.22);
      osc.start(ctx.currentTime + i*0.25);
      osc.stop(ctx.currentTime + i*0.25 + 0.25);
    });
  }catch(e){}
  // 弹窗
  const doneCard = document.getElementById('timerDoneCard');
  if(doneCard){ doneCard.style.display = 'block'; doneCard.scrollIntoView({behavior:'smooth'}); }
  toast('🔔 ' + (LANG==='zh'?'时间到啦！':'Time is up!'));
  // 浏览器通知
  if('Notification' in window && Notification.permission === 'granted'){
    new Notification('⏱️ ' + (LANG==='zh'?'时间到啦！':'Time is up!'), { body: LANG==='zh' ? '休息一下吧' : 'Take a break' });
  }
}

  const dayData = days.map(function(d){ return { date:d, mins: Math.round(((clean[d]||{}).totalSec||0)/60) }; });
  // 柱形图
  const maxMin = Math.max(60, dayData.reduce(function(a,d){ return Math.max(a,d.mins); }, 0));
  const barHtml = dayData.length ? dayData.map(function(d){
    var h = Math.round(d.mins / maxMin * 100);
    return '<div class="bar-col"><div class="bar-val">' + d.mins + '</div><div class="bar" style="height:' + h + '%"></div><div class="bar-lb">' + d.date.slice(5) + '</div></div>';

  // 折线图（SVG）
  var lineHtml = '';
  if(dayData.length){
    var w=520, h=170, pad=30;
    var pts = dayData.map(function(d,i){
      var x = pad + (dayData.length>1 ? i*(w-pad*2)/(dayData.length-1) : (w/2));
      var y = h - pad - (d.mins / maxMin) * (h-pad*2);
      return { x:x, y:y, mins:d.mins, label:d.date.slice(5) };
    });
    var pathD = pts.map(function(p,i){ return (i===0?'M':'L') + p.x + ',' + p.y; }).join(' ');
    var areaD = pathD + ' L' + pts[pts.length-1].x + ',' + (h-pad) + ' L' + pts[0].x + ',' + (h-pad) + ' Z';
    lineHtml = '<svg viewBox="0 0 ' + w + ' ' + h + '" style="width:100%;height:180px">' +
      '<defs><linearGradient id="lg1" x1="0" y1="0" x2="0" y2="1">' +
      '<stop offset="0%" stop-color="var(--accent)" stop-opacity="0.4"/><stop offset="100%" stop-color="var(--accent)" stop-opacity="0"/>' +
      '</linearGradient></defs>' +
      '<path d="' + areaD + '" fill="url(#lg1)"/>' +
      '<path d="' + pathD + '" fill="none" stroke="var(--accent)" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>' +
      pts.map(function(p){
        return '<circle cx="' + p.x + '" cy="' + p.y + '" r="4" fill="var(--accent)" stroke="#fff" stroke-width="2"><title>' + p.label + ': ' + p.mins + 'min</title></circle>';
      }).join('') +
      pts.map(function(p,i){
        return '<text x="' + p.x + '" y="' + (h-pad+16) + '" text-anchor="middle" style="font-size:10px;fill:var(--text-mute)">' + p.label + '</text>';
      }).join('') +
      pts.map(function(p){
        return '<text x="' + p.x + '" y="' + (p.y-10) + '" text-anchor="middle" style="font-size:10px;fill:var(--accent);font-weight:700">' + p.mins + '</text>';
      }).join('') +
    '</svg>';
  } else {
    lineHtml = '<div class="empty"><span class="emo">📊</span>' + (LANG==='zh'?'暂无数据':'No data') + '</div>';
  }
  // 今日详情 & 页面排名
  var todayHtml = '';
  var pageRankingHtml = '';
  if(totalToday){
    var t = totalToday;
    var pageKeys = Object.keys(t.pages).filter(function(k){ return !k.endsWith('_time'); });
    var sorted = pageKeys.sort(function(a,b){ return t.pages[b] - t.pages[a]; });
    todayHtml = sorted.map(function(k){
      var timeKey = k + '_time';
      var sec = t.pages[timeKey] || 0;
      return '<div class="list-item"><div class="li-main"><div class="li-title">' + (NAV_LABELS_ZH[k]||k) + '</div><div class="li-sub">' + t.pages[k] + ' ' + (LANG==='zh'?'次':'times') + (sec ? ' · ' + Math.round(sec/60) + ' ' + (LANG==='zh'?'分钟':'min') : '') + '</div></div></div>';
    }).join('');
    // Top 3 排名
    var top3 = sorted.slice(0,3);
    if(top3.length){
      pageRankingHtml = top3.map(function(k,i){
        var icon = NAV_ICONS[k] || '📄';
        var medal = ['🥇','🥈','🥉'][i];
        var timeKey = k + '_time';
        var sec = t.pages[timeKey] || 0;
        return '<div style="display:flex;align-items:center;gap:10px;padding:8px;background:var(--bg-soft);border-radius:8px;margin-bottom:6px">' +
          '<div style="font-size:18px">' + medal + '</div>' +
          '<div style="font-size:20px">' + icon + '</div>' +
          '<div style="flex:1"><div style="font-size:13px;font-weight:600">' + (NAV_LABELS_ZH[k]||k) + '</div><div style="font-size:11px;color:var(--text-mute)">' + t.pages[k] + ' ' + (LANG==='zh'?'次':'times') + (sec?' · '+Math.round(sec/60)+'min':'') + '</div></div>' +
        '</div>';
      }).join('');
    }
  }
  // 7天排名汇总
  var weekRankHtml = '';
  if(days.length){
    var pageTotals = {};
    days.forEach(function(d){
      var pp = (clean[d]||{}).pages || {};
      Object.keys(pp).forEach(function(k){
        if(!k.endsWith('_time')) pageTotals[k] = (pageTotals[k]||0) + pp[k];
      });
    });
    var wkSorted = Object.keys(pageTotals).sort(function(a,b){ return pageTotals[b] - pageTotals[a]; }).slice(0,5);
    var wkMax = wkSorted.length ? pageTotals[wkSorted[0]] : 1;
    weekRankHtml = wkSorted.map(function(k){
      var pct = Math.round(pageTotals[k]/wkMax*100);
      var icon = NAV_ICONS[k] || '📄';
      return '<div style="margin-bottom:8px">' +
        '<div style="display:flex;justify-content:space-between;font-size:12px;margin-bottom:3px"><span>' + icon + ' ' + (NAV_LABELS_ZH[k]||k) + '</span><span style="color:var(--text-mute)">' + pageTotals[k] + '</span></div>' +
        '<div style="height:6px;background:var(--bg-soft);border-radius:3px;overflow:hidden"><div style="width:' + pct + '%;height:100%;background:linear-gradient(90deg,var(--accent),var(--accent-deep));border-radius:3px;transition:width .8s"></div></div>' +
      '</div>';
    }).join('');
  }
  return `
    <div class="page-head"><div class="page-title"><span class="emoji">📈</span> ${LANG==='zh'?'使用统计':'Usage'}</div><div class="page-sub">${LANG==='zh'?'每天干了啥 · 可视化呈现':'Daily activity · Visualized'}</div></div>
    <div class="grid-3" style="margin-bottom:14px;text-align:center">
      <div class="card"><div class="stat-num" style="font-size:24px">${days.length}</div><div class="stat-lb">${LANG==='zh'?'累计天数':'Days'}</div></div>
      <div class="card"><div class="stat-num" style="font-size:24px">${Math.round(weekMin)}</div><div class="stat-lb">${LANG==='zh'?'本周总分钟':'Min this week'}</div></div>
      <div class="card"><div class="stat-num" style="font-size:24px">${totalToday ? Object.keys(totalToday.pages).filter(function(k){ return !k.endsWith('_time'); }).length : 0}</div><div class="stat-lb">${LANG==='zh'?'今日打开':'Panels today'}</div></div>
    </div>
    <div class="card">
      <div class="card-head">
        <div class="card-title"><span class="dot"></span> 📊 ${LANG==='zh'?'最近7天使用时长':'Last 7 days'}</div>
        <div style="display:flex;gap:4px">
          <button class="cat-pill ${savedMode==='bar'?'active':''}" onclick="Store.set('usageChartMode','bar');renderPage('usage')">📊</button>
          <button class="cat-pill ${savedMode==='line'?'active':''}" onclick="Store.set('usageChartMode','line');renderPage('usage')">📈</button>
        </div>
      </div>
      ${savedMode==='bar' ? '<div class="bar-chart" style="height:180px">' + barHtml + '</div>' : '<div>' + lineHtml + '</div>'}
    </div>
    <div class="grid-cols-2-1" style="margin-top:14px">
      <div>
        ${pageRankingHtml ? '<div class="card"><div class="card-title"><span class="dot"></span> 🔥 ' + (LANG==='zh'?'今日 Top 3':'Today Top 3') + '</div>' + pageRankingHtml + '</div>' : ''}
        ${weekRankHtml ? '<div class="card" style="margin-top:14px"><div class="card-title"><span class="dot"></span> 🏆 ' + (LANG==='zh'?'本周板块排行':'This week ranking') + '</div><div style="padding:8px">' + weekRankHtml + '</div></div>' : ''}
      </div>
      <div>
        <div class="card">
          <div class="card-title"><span class="dot"></span> 📋 ${LANG==='zh'?'今日详情':'Today details'}</div>
          ${todayHtml || '<div class="empty"><span class="emo">📋</span>' + (LANG==='zh'?'今天还没怎么用哦':'Not much today') + '</div>'}
        </div>
      </div>
    </div>
  `;
}

/* ====== 姨妈日记 / 经期追踪 ====== */
var _periodCalYM = null;
function periodCalShift(delta){
  if(!_periodCalYM) _periodCalYM = { y: new Date().getFullYear(), m: new Date().getMonth() };
  _periodCalYM.m += delta;
  while(_periodCalYM.m < 0){ _periodCalYM.m += 12; _periodCalYM.y--; }
  while(_periodCalYM.m > 11){ _periodCalYM.m -= 12; _periodCalYM.y++; }
  renderPage('period');
}
function _daysBetween(d1, d2){ return Math.round((new Date(d2) - new Date(d1)) / 86400000); }
function _fmtDate(d){ return d.getFullYear() + '-' + String(d.getMonth()+1).padStart(2,'0') + '-' + String(d.getDate()).padStart(2,'0'); }
function _periodPhase(todayDate, lastStart, cycleAvg, periodLen){
  // 返回 'pre'(经前7天内), 'during'(经期内), 'post'(经期后), 'far'(远离)
  var daysToNext = _daysBetween(todayDate, new Date(new Date(lastStart).getTime() + cycleAvg*86400000));
  var daysSinceStart = _daysBetween(lastStart, todayDate);
  if(daysSinceStart >= 0 && daysSinceStart < periodLen) return {phase:'during', day: daysSinceStart+1};
  if(daysToNext >=0 && daysToNext <= 7) return {phase:'pre', daysLeft: daysToNext};
  if(daysSinceStart >= periodLen && daysSinceStart < cycleAvg) return {phase:'post', day: daysSinceStart - periodLen + 1};
  return {phase:'far', daysToNext: daysToNext};
}
function htmlPeriod(){
  var periods = Store.get('periodRecords', []); // [{start, end, note}]
  periods.sort(function(a,b){ return new Date(b.start) - new Date(a.start); });
  var cfg = Store.get('periodCfg', { cycleAvg: 28, periodLen: 5 });
  var todayDate = _fmtDate(new Date());
  // 计算平均周期
  var cycleLen = cfg.cycleAvg || 28;
  if(periods.length >= 2){
    var diffs = [];
    for(var i=1; i<periods.length; i++){
      var d = _daysBetween(periods[i].start, periods[i-1].start);
      if(d >= 15 && d <= 60) diffs.push(d);
    }
    if(diffs.length){
      cycleLen = Math.round(diffs.reduce(function(a,b){return a+b;},0) / diffs.length);
    }
  }
  Store.set('periodCfg', { cycleAvg: cycleLen, periodLen: cfg.periodLen || 5 });
  var periodLen = cfg.periodLen || 5;
  var last = periods[0] || null;
  // 预测下次
  var nextStart = null, daysUntil = null, phaseInfo = {phase:'far', daysToNext:null};
  if(last){
    nextStart = _fmtDate(new Date(new Date(last.start).getTime() + cycleLen*86400000));
    daysUntil = _daysBetween(todayDate, nextStart);
    phaseInfo = _periodPhase(todayDate, last.start, cycleLen, periodLen);
  }
  // 选今日tip
  var tipSeed = new Date().getFullYear()*10000 + (new Date().getMonth()+1)*100 + new Date().getDate();
  var tip = '';
  if(phaseInfo.phase === 'during'){
    tip = PERIOD_TIPS[tipSeed % PERIOD_TIPS.length];
  } else if(phaseInfo.phase === 'pre'){
    tip = PERIOD_PRE_TIPS[tipSeed % PERIOD_PRE_TIPS.length];
  } else if(phaseInfo.phase === 'post'){
    tip = PERIOD_POST_TIPS[tipSeed % PERIOD_POST_TIPS.length];
  } else {
    tip = PERIOD_POST_TIPS[tipSeed % PERIOD_POST_TIPS.length];
  }
  // 日历年月（可翻）
  var _now = new Date();
  if(typeof _periodCalYM === 'undefined') _periodCalYM = null;
  var _calTarget = _periodCalYM || { y: _now.getFullYear(), m: _now.getMonth() };
  if(_calTarget.y < 1990) _calTarget.y = _now.getFullYear();
  if(_calTarget.y > 2100) _calTarget.y = _now.getFullYear();
  var y = _calTarget.y, m = _calTarget.m;
  var firstDay = new Date(y, m, 1);
  var lastDay = new Date(y, m+1, 0);
  var startW = firstDay.getDay();
  var totalDays = lastDay.getDate();
  // 收集该月的经期日期（历史 + 预测）
  var periodDateSet = {};
  periods.forEach(function(p){
    var ps = new Date(p.start), pe = new Date(p.end || new Date(p.start).getTime() + periodLen*86400000);
    for(var d=new Date(ps); d<=pe; d=new Date(d.getTime()+86400000)){
      if(d.getFullYear()===y && d.getMonth()===m){
        periodDateSet[d.getDate()] = periodDateSet[d.getDate()] || {real:true};
      }
    }
  });
  // 预测：基于最近一次姨妈 + 计算周期，往前推一年、往后推一年都标
  if(periods.length){
    var lastStartD = new Date(periods[0].start);
    // 预测往前后推 24 个月
    for(var fi=-24; fi<=24; fi++){
      var predStart = new Date(lastStartD.getTime() + fi*cycleLen*86400000);
      if(predStart.getFullYear()===y && predStart.getMonth()===m){
        for(var k=0; k<periodLen; k++){
          var pd2 = new Date(predStart.getTime() + k*86400000);
          if(pd2.getMonth()===m){
            if(!periodDateSet[pd2.getDate()]) periodDateSet[pd2.getDate()] = {predict:true};
          }
        }
      }
    }
  }
  var calHead = '<div class="cal-head" style="margin-bottom:8px">' +
    '<button class="icon-btn" onclick="periodCalShift(-1)" style="padding:4px 10px">←</button>' +
    '<button class="icon-btn" onclick="periodCalShift(-12)" style="padding:4px 8px;font-size:10px">«</button>' +
    '<b style="font-size:14px">' + y + '年 ' + (m+1) + '月</b>' +
    '<button class="icon-btn" onclick="periodCalShift(12)" style="padding:4px 8px;font-size:10px">»</button>' +
    '<button class="icon-btn" onclick="periodCalShift(1)" style="padding:4px 10px">→</button>' +
    '<button class="icon-btn" onclick="_periodCalYM=null;renderPage(\'period\')" style="padding:4px 8px;font-size:10px;margin-left:4px">Today</button>' +
    '</div>';
  var calHtml = calHead + '<div style="display:grid;grid-template-columns:repeat(7,1fr);gap:4px;font-size:11px;text-align:center">';
  ['日','一','二','三','四','五','六'].forEach(function(w){ calHtml += '<div style="color:var(--text-mute);padding:4px 0;font-weight:600">'+w+'</div>'; });
  for(var s=0; s<startW; s++) calHtml += '<div></div>';
  for(var day=1; day<=totalDays; day++){
    var _realToday = new Date();
    var isToday = (day===_realToday.getDate() && m===_realToday.getMonth() && y===_realToday.getFullYear());
    var pd = periodDateSet[day];
    var cls = '';
    if(pd && pd.real) cls = 'background:#e91e63;color:#fff';
    else if(pd && pd.predict) cls = 'background:#fce4ec;color:#c2185b;border:1px dashed #c2185b';
    var border = isToday ? 'outline:2px solid var(--accent);outline-offset:-2px' : '';
    calHtml += '<div style="padding:6px 0;border-radius:6px;font-weight:' + (isToday?800:'400') + ';transition:all .2s;' + cls + ';' + border + '">' + day + '</div>';
  }
  calHtml += '</div>';
  // 最近几次历史
  var historyHtml = periods.length ? periods.slice(0,6).map(function(p,i){
    var days = _daysBetween(p.start, p.end ? p.end : new Date(p.start));
    var cycleInfo = '';
    if(i<periods.length-1){
      var cl = _daysBetween(periods[i+1].start, p.start);
      if(cl>=15 && cl<=60) cycleInfo = ' · 周期 ' + cl + '天';
    }
    return '<div class="list-item"><div class="li-main"><div class="li-title">🩸 ' + p.start + (p.end ? ' → ' + p.end : '') + '</div><div class="li-sub">持续 ' + (days||periodLen) + '天' + cycleInfo + (p.note ? ' · ' + p.note : '') + '</div></div><div style="display:flex;gap:4px"><button class="icon-btn" onclick="editPeriod(\''+p.start+'\')">✏️</button><button class="icon-btn" onclick="delPeriod(\''+p.start+'\')">🗑️</button></div></div>';
  }).join('') : '<div class="empty"><span class="emo">🩸</span>' + (LANG==='zh'?'还没记录过姨妈哦 · 点下面按钮添加第一次':'No records yet') + '</div>';
  // Phase 显示
  var phaseLabel = '', phaseIcon = '', phaseColor = '#e91e63';
  if(phaseInfo.phase === 'during'){
    phaseLabel = LANG==='zh' ? '姨妈第 ' + phaseInfo.day + ' 天' : 'Day ' + phaseInfo.day + ' of period';
    phaseIcon = '🩸'; phaseColor = '#e91e63';
  } else if(phaseInfo.phase === 'pre'){
    phaseLabel = LANG==='zh' ? '姨妈还有 ' + phaseInfo.daysLeft + ' 天来' : phaseInfo.daysLeft + ' days until period';
    phaseIcon = '🌙'; phaseColor = '#ff9800';
  } else if(phaseInfo.phase === 'post'){
    phaseLabel = LANG==='zh' ? '姨妈走后第 ' + phaseInfo.day + ' 天' : 'Day ' + phaseInfo.day + ' post period';
    phaseIcon = '🌸'; phaseColor = '#4caf50';
  } else {
    phaseLabel = daysUntil !== null 
      ? (daysUntil > 0 
          ? (LANG==='zh' ? '距离下次姨妈还有 ' + daysUntil + ' 天' : daysUntil + ' days until next period')
          : (LANG==='zh' ? '姨妈可能推迟了 ' + Math.abs(daysUntil) + ' 天' : 'Period late by ' + Math.abs(daysUntil) + ' days'))
      : (LANG==='zh' ? '开始记录你的第一次姨妈吧 ✨' : 'Start your first record ✨');
    phaseIcon = daysUntil !== null && daysUntil < 0 ? '⚠️' : '📅';
    phaseColor = daysUntil !== null && daysUntil < 0 ? '#ff5722' : '#2196f3';
  }
  return `
    <div class="page-head"><div class="page-title"><span class="emoji">🩸</span> ${LANG==='zh'?'姨妈日记':'Period Diary'}</div><div class="page-sub">${LANG==='zh'?'记录经期 · 预测下次 · 每日健康提醒':'Track · Predict · Daily tips'}</div></div>
    <!-- 状态卡 -->
    <div class="card" data-dark="1" style="background:linear-gradient(135deg,#fce4ec,#f8bbd0);color:#880e4f;margin-bottom:14px">
      <div style="font-size:11px;opacity:.7;letter-spacing:2px;margin-bottom:4px">${phaseIcon} ${LANG==='zh'?'当前状态':'Current'}</div>
      <div style="font-size:28px;font-weight:800">${phaseLabel}</div>
      <div style="font-size:12px;margin-top:10px;padding-top:10px;border-top:1px solid rgba(136,14,79,.15);opacity:.9">💡 ${tip}</div>
    </div>
    <div class="grid-cols-2-1">
      <div>
        <!-- 预测卡 -->
        <div class="card" style="margin-bottom:14px">
          <div class="card-head"><div class="card-title"><span class="dot"></span> 📅 ${LANG==='zh'?'预测 & 历史':'Predict & History'}</div></div>
          ${last ? '<div style="font-size:12px;color:var(--text-mute);margin-bottom:8px">' + (LANG==='zh'?'上次':'Last') + ': ' + last.start + (last.end ? ' → ' + last.end : '') + '</div>' : '<div style="font-size:12px;color:#c2185b;margin-bottom:8px">✨ ' + (LANG==='zh'?'添加第一次姨妈记录，我就能帮你预测啦':'Add your first period to get predictions') + '</div>'}
          <div style="font-size:12px;margin-bottom:4px;display:flex;justify-content:space-between"><span>${LANG==='zh'?'平均周期':'Cycle'}</span><span style="font-weight:700;color:#c2185b">${cycleLen} ${LANG==='zh'?'天':'d'}</span></div>
          <div style="font-size:12px;margin-bottom:4px;display:flex;justify-content:space-between"><span>${LANG==='zh'?'经期时长':'Period len'}</span><span style="font-weight:700;color:#c2185b">${periodLen} ${LANG==='zh'?'天':'d'}</span></div>
          ${nextStart ? '<div style="font-size:12px;margin-bottom:8px;display:flex;justify-content:space-between"><span>🔮 ' + (LANG==='zh'?'预计下次':'Next') + '</span><span style="font-weight:700;color:#c2185b">' + nextStart + '</span></div>' : ''}
          <div style="display:flex;gap:8px;margin-top:10px;flex-wrap:wrap">
            <button class="btn btn-primary btn-sm" onclick="openPeriodAdd()">🩸 ${LANG==='zh'?'开始姨妈 (记录今天)':'Start period (today)'}</button>
            <button class="btn btn-ghost btn-sm" onclick="openPeriodCfg()">⚙️ ${LANG==='zh'?'设置周期':'Settings'}</button>
          </div>
        </div>
        <!-- 本月日历 -->
        <div class="card" style="margin-bottom:14px">
          <div class="card-head"><div class="card-title"><span class="dot"></span> ${y}年${m+1}月 ${LANG==='zh'?'日历':'Calendar'}</div></div>
          ${calHtml}
          <div style="font-size:11px;color:var(--text-mute);margin-top:8px;display:flex;gap:12px;flex-wrap:wrap">
            <span><span style="display:inline-block;width:12px;height:12px;background:#e91e63;border-radius:3px;vertical-align:middle;margin-right:3px"></span>${LANG==='zh'?'经期':'Period'}</span>
            <span><span style="display:inline-block;width:12px;height:12px;background:#fce4ec;border-radius:3px;vertical-align:middle;margin-right:3px;border:1px dashed #c2185b"></span>${LANG==='zh'?'预测':'Predicted'}</span>
          </div>
        </div>
      </div>
      <div>
        <!-- 历史列表 -->
        <div class="card">
          <div class="card-head"><div class="card-title"><span class="dot"></span> 📋 ${LANG==='zh'?'历史记录':'History'}</div><span style="font-size:11px;color:var(--text-mute)">${periods.length} ${LANG==='zh'?'次':'times'}</span></div></div>
          ${historyHtml}
        </div>
      </div>
    </div>
  `;
}
function openPeriodAdd(){
  var today = _fmtDate(new Date());
  openModal('<div class="modal-title">🩸 ' + (LANG==='zh'?'记录姨妈':'Log period') + '</div>' +
    '<div style="font-size:12px;color:var(--text-mute);margin-bottom:10px">' + (LANG==='zh'?'选择姨妈开始的日期':'Pick period start date') + '</div>' +

// 让 photo-grid 支持用户自己上传的照片
function uploadTravelPhoto(){
  const input = document.createElement('input');
  input.type = 'file'; input.accept = 'image/*'; input.multiple = true;
  input.onchange = function(e){
    const myPhotos = Store.get('myTravelPhotos', []);
    let done = 0, total = e.target.files.length;
    Array.from(e.target.files).forEach(function(f){
      const reader = new FileReader();
      reader.onload = function(ev){
        myPhotos.push({src:ev.target.result, loc:'', caption:'', tag:'', date:new Date().toLocaleString()});
        done++;
        if(done===total){ Store.set('myTravelPhotos', myPhotos); renderPage('travel'); toast('📸 ' + (LANG==='zh'?'已添加':'Added ' + total + ' photos')); }
      };
      reader.readAsDataURL(f);
    });
  };
  input.click();
}

        </div>
      </div>
    </div>
  `;
}

/* ========== 辅助函数 ========== */
function getWeekNum(){ const d=new Date();d.setDate(d.getDate()+4-(d.getDay()||7));return Math.ceil((((d-new Date(d.getFullYear(),0,1))/86400000)+1)/7);}
function getWeekRange(){ const now=new Date();const day=now.getDay()||7;const mon=new Date(now);mon.setDate(now.getDate()-day+1);const sun=new Date(mon);sun.setDate(mon.getDate()+6);return (mon.getMonth()+1)+'/'+mon.getDate()+'-'+(sun.getMonth()+1)+'/'+sun.getDate();}

/* ========== 日历渲染 ========== */
var _calYM = null;
function renderCalendar(){
  if(!_calYM){ _calYM = { year: new Date().getFullYear(), month: new Date().getMonth() }; }
  const year = _calYM.year, month = _calYM.month;
  const first = new Date(year, month, 1);
  const days = new Date(year, month+1, 0).getDate();
  const startW = first.getDay();
  const todos = Store.get('todos', []);
  const chk = Store.get('checkins', {});
  let html = `<div class="cal-head"><button class="icon-btn" onclick="changeMonth(-12)" style="padding:2px 8px;font-size:10px" title="Year back">«</button><button class="icon-btn" onclick="changeMonth(-1)">←</button><b>${year}年 ${month+1}月</b><button class="icon-btn" onclick="changeMonth(1)">→</button><button class="icon-btn" onclick="changeMonth(12)" style="padding:2px 8px;font-size:10px" title="Year fwd">»</button><button class="icon-btn" onclick="_calYM=null;renderPage('daily')" style="padding:2px 8px;font-size:10px;margin-left:4px">Today</button></div>`;
  html += '<div class="calendar">';
  const wds = LANG==='zh'?['日','一','二','三','四','五','六']:['S','M','T','W','T','F','S'];
  wds.forEach(w=>html += `<div class="cal-hd">${w}</div>`);
  for(let i=0;i<startW;i++) html += '<div class="cal-day empty"></div>';
  for(let d=1;d<=days;d++){
    const ds = `${year}-${String(month+1).padStart(2,'0')}-${String(d).padStart(2,'0')}`;
    const isToday = ds===today();
    const hasTodo = todos.some(t=>t.date===ds);
    const anyChk = Object.values(chk).some(arr=>arr.includes(ds));
    html += `<div class="cal-day${isToday?' today':''}${hasTodo?' has-todo':''}${anyChk?' checked-day':''}" title="${ds}">${d}</div>`;
  }
  html += '</div>';
  return html;
}

/* ====== 农历日期 + 生肖 + 天干地支（简化版） ====== */
const LUNAR_INFO = (function(){
  // 1900-2100 农历每月天数表（简化版，够用就行）
  // 天干地支
  const TIANGAN = ['甲','乙','丙','丁','戊','己','庚','辛','壬','癸'];
  const DIZHI = ['子','丑','寅','卯','辰','巳','午','未','申','酉','戌','亥'];
  const SHENGXIAO = ['鼠','牛','虎','兔','龙','蛇','马','羊','猴','鸡','狗','猪'];
  // 农历月名
  const LUNAR_MONTHS = ['正','二','三','四','五','六','七','八','九','十','冬','腊'];
  const LUNAR_DAYS = ['初一','初二','初三','初四','初五','初六','初七','初八','初九','初十',
    '十一','十二','十三','十四','十五','十六','十七','十八','十九','二十',
    '廿一','廿二','廿三','廿四','廿五','廿六','廿七','廿八','廿九','三十'];
  // 2024-2030 每年农历闰月信息和大小月（简化硬编码）
  const YEAR_TABLE = {
    2024:{leap:0,months:[29,30,29,30,29,30,29,30,30,29,30,29]}, // 甲辰龙年
    2025:{leap:6,months:[30,29,30,29,30,29,30,29,30,29,30,29]}, // 乙巳蛇年 闰六月
    2026:{leap:0,months:[30,29,30,29,30,29,30,29,30,29,30,29]}, // 丙午马年
    2027:{leap:0,months:[30,29,30,30,29,30,29,30,29,30,29,30]}, // 丁未羊年
    2028:{leap:5,months:[29,30,30,29,30,29,30,29,30,29,30,29]}, // 戊申猴年 闰五月
    2029:{leap:0,months:[29,30,29,30,29,30,29,30,30,29,30,29]}, // 己酉鸡年
    2030:{leap:0,months:[30,29,30,29,30,29,30,30,29,30,29,30]}, // 庚戌狗年
  };
  // 2024-2030 每年农历正月初一对应的公历日期
  const NEW_YEAR = {
    2024:new Date(2024,1,10),  // 2024-02-10
    2025:new Date(2025,0,29),  // 2025-01-29
    2026:new Date(2026,1,17),  // 2026-02-17
    2027:new Date(2027,1,6),   // 2027-02-06
    2028:new Date(2028,0,26),  // 2028-01-26
    2029:new Date(2029,1,13),  // 2029-02-13
    2030:new Date(2030,1,3),   // 2030-02-03
  };
  function get(date){
    var y = date.getFullYear();
    // 确定农历年
    var ly = y;
    var ny = NEW_YEAR[y];
    if(date < ny){ ly = y - 1; ny = NEW_YEAR[ly]; }
    // 计算从正月初一开始过了多少天
    var diff = Math.floor((date - ny) / 86400000);
    var yt = YEAR_TABLE[ly] || YEAR_TABLE[2026];
    var month = 0, day = 0;
    var total = 0;
    for(var i = 0; i < yt.months.length; i++){
      if(diff < total + yt.months[i]){ month = i; day = diff - total; break; }
      total += yt.months[i];
    }
    // 天干地支年（从1900庚子年开始算）
    var ganzhiYear = (ly - 1900) % 60;
    var gan = TIANGAN[ganzhiYear % 10];
    var zhi = DIZHI[ganzhiYear % 12];
    var sx = SHENGXIAO[ganzhiYear % 12];
    return {
      year: ly, gan: gan, zhi: zhi, shengxiao: sx,
      month: LUNAR_MONTHS[month], day: LUNAR_DAYS[day],
      fullDate: gan + zhi + '年 · 属' + sx + ' · ' + LUNAR_MONTHS[month] + '月' + LUNAR_DAYS[day]
    };
  }
  return {get:get};
})();

function openBookReader(bookId){
  const b = Store.get('books', DEFAULT_BOOKS).find(function(x){ return x.id===bookId; });
  if(!b) return toast(LANG==='zh'?'书不存在':'Book not found');
  if(!b.online){
    openModal('<div class="modal-title">' + b.title + '</div>\n      <div style="text-align:center;padding:20px">\n        <div style="font-size:40px;margin-bottom:10px">📱</div>\n        <div style="margin-bottom:12px">' + (LANG==='zh'?'这个格式浏览器暂时不能在线阅读':'This format can\'t read online') + '</div>\n        <div style="font-size:11px;color:var(--text-mute);margin-bottom:16px">' + (LANG==='zh'?'建议下载到手机，用 Kindle APP 或 Calibre 打开':'Download and open with Kindle/Calibre') + '</div>\n        <div style="display:flex;gap:8px;justify-content:center">\n          <a href="' + b.file + '" download class="btn btn-primary">' + (LANG==='zh'?'下载文件':'Download') + '</a>\n          <button class="btn btn-ghost" onclick="closeModal()">' + (LANG==='zh'?'关闭':'Close') + '</button>\n        </div>\n      </div>');
    return;
  }
  // 选今日一言（固定种子让当天一致）
  var today = new Date();
  var seed = today.getFullYear()*10000 + (today.getMonth()+1)*100 + today.getDate();
  var quote = DAILY_QUOTES[seed % DAILY_QUOTES.length];
  var url = b.file;
  var hasCover = b.cover && b.cover.length>0;
  var coverBg = hasCover
    ? 'background-image:url(' + b.cover + ');background-size:cover;background-position:center'
    : 'background:linear-gradient(135deg,#667eea,#764ba2)';
  var coverHtml = '<div id="bookCoverPage" style="display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:30px 20px">' +
    '<div style="width:120px;height:170px;border-radius:10px;overflow:hidden;box-shadow:0 8px 24px rgba(0,0,0,.25);margin-bottom:20px;' + coverBg + ';' + (hasCover?'':'display:flex;align-items:center;justify-content:center;font-size:48px') + '">' + (hasCover?'':b.emoji) + '</div>' +
    '<div style="font-size:20px;font-weight:800;color:var(--text)">' + b.title + '</div>' +
    '<div style="font-size:12px;color:var(--text-mute);margin-top:4px">' + (b.author||'') + '</div>' +
    '<div style="width:40px;height:2px;background:var(--accent);margin:14px auto"></div>' +
    '<div style="font-size:13px;font-style:italic;color:var(--text-soft);line-height:1.6;max-width:280px">"' + quote.q + '"</div>' +

  '</div>';
  var readerHtml = '<div id="bookReadBody" style="display:none">' +
    '<div style="display:flex;gap:8px;margin-bottom:10px;font-size:11px;color:var(--text-mute);align-items:center;flex-wrap:wrap">' +
      '<span style="background:var(--accent-soft);color:var(--accent);padding:2px 8px;border-radius:10px">' + FMT_LABELS[b.format] + '</span>' +

        '<button class="btn btn-ghost btn-sm" onclick="document.getElementById(\'bookCoverPage\').style.display=\'flex\';document.getElementById(\'bookReadBody\').style.display=\'none\'">📖 ' + (LANG==='zh'?'封面':'Cover') + '</button>' +
        '<a href="' + url + '" target="_blank" class="btn btn-ghost btn-sm">↗️ ' + (LANG==='zh'?'新窗口':'New tab') + '</a>' +
        '<button class="btn btn-ghost btn-sm" onclick="closeModal()">✕</button>' +
      '</div>' +
    '</div>' +
    '<div style="border:1px solid var(--border);border-radius:8px;overflow:hidden;background:#fff">' +
      '<iframe src="' + url + '" style="width:100%;height:80vh;border:none;display:block"></iframe>' +
    '</div>' +
  '</div>';

function importBookFile(){
  const input = document.createElement('input');
  input.type = 'file';
  input.accept = '.pdf,.html,.htm,.epub,.azw3,.txt';
  input.onchange = function(e){
    const f = e.target.files?.[0]; if(!f) return;
    const reader = new FileReader();
    reader.onload = function(ev){
      const arr = Store.get('books', DEFAULT_BOOKS);
      const ext = f.name.split('.').pop().toLowerCase();
      const title = f.name.replace(/\.[^.]+$/, '').replace(/_\d+-\d+-\d+.*$/, '');
      // 存 dataURL（不复制文件，base64 存 localStorage）
      const newBook = {
        id:'u_' + uid(),
        title: title || f.name,
        author:'',
        progress:0,
        emoji:'📚',
        format: ext,
        file: ev.target.result,
        cover:'',
        desc: LANG==='zh'?'（用户导入）':'(imported)',
        online: canOnlineRead(ext)
      };
      arr.push(newBook);
      Store.set('books', arr);
      renderPage('book');
      toast('📖 ' + (LANG==='zh'?'已导入：':'Imported: ') + newBook.title);
    };
    reader.readAsDataURL(f);
  };
  input.click();
}
/* 用户上传封面 */
function uploadBookCover(bookId){
  const input = document.createElement('input');
  input.type = 'file'; input.accept = 'image/*';
  input.onchange = function(e){
    const f = e.target.files?.[0]; if(!f) return;
    const reader = new FileReader();
    reader.onload = function(ev){
      const arr = Store.get('books', DEFAULT_BOOKS);
      const b = arr.find(function(x){ return x.id===bookId; });
      if(b){ b.cover = ev.target.result; Store.set('books', arr); renderPage('book'); toast('✨ ' + (LANG==='zh'?'封面已设置':'Cover set')); }
    };
    reader.readAsDataURL(f);
  };
  input.click();
}

/* ====== 导入 HTML Prompt 库 ====== */
function handlePromptImport(e){
  const f = e.target.files?.[0]; if(!f) return;
  const reader = new FileReader();
  reader.onload = function(ev){
    const html = ev.target.result;
    const doc = new DOMParser().parseFromString(html, 'text/html');
    // 尝试多种选择器匹配 prompt 卡片
    const cards = doc.querySelectorAll('.prompt-card, .prompt-content, [data-prompt], .prompt-item, .prompt, li.prompt');
    const found = [];
    const today = new Date().toISOString().slice(0,10);
    // 方式1：如果是工作台自己导出的 HTML，有 prompt-card 结构
    doc.querySelectorAll('.prompt-card').forEach(function(card){
      const content = card.querySelector('.prompt-content');
      const tag = card.querySelector('.tag');
      if(content){
        found.push({
          id: uid(),
          cat: tag ? tag.textContent.trim() : '其他',
          content: content.textContent.trim(),
          date: today
        });
      }
    });
    // 方式2：通用提取 h2/h3 + p/div 的组合（自建prompt库大概率是这种结构）
    if(!found.length){
      const headings = doc.querySelectorAll('h2, h3, .prompt-title, .prompt-name');
      headings.forEach(function(h){
        const title = h.textContent.trim();
        // 找紧跟着的内容（下一个 p、div、pre、code）
        let content = '';
        let el = h.nextElementSibling;
        while(el && !content){
          if(['P','DIV','PRE','CODE','BLOCKQUOTE','LI','TEXTAREA'].indexOf(el.tagName)>=0 && el.textContent.trim().length > 10){
            content = el.textContent.trim();
          }
          el = el.nextElementSibling;
        }
        if(title && content && content.length > 10){
          found.push({id: uid(), cat: '其他', content: content, date: today});
        }
      });
    }
    // 方式3：如果还是没找到，就把所有有意义的 textarea/pre/code 内容都提取
    if(!found.length){
      doc.querySelectorAll('textarea, pre, code').forEach(function(el){
        const text = el.textContent.trim();
        if(text.length > 20){
          found.push({id: uid(), cat: '其他', content: text, date: today});
        }
      });
    }
    // 方式4：终极保底——把 body 里的大段文字按句号/换行拆成 prompt
    if(!found.length){
      const text = doc.body ? doc.body.innerText : '';
      const paragraphs = text.split(/\n\n+|\n---+\n+/).map(function(p){ return p.trim(); }).filter(function(p){ return p.length > 15 && p.length < 2000; });
      paragraphs.forEach(function(p){
        found.push({id: uid(), cat: '其他', content: p, date: today});
      });
    }
    if(!found.length){
      toast(LANG==='zh'?'没找到能解析的 Prompt':'No prompts found');
      return;
    }
    // 合并去重
    const mine = Store.get('prompts_mine', DEFAULT_PROMPTS);
    let added = 0, dup = 0;
    found.forEach(function(p){
      if(!mine.find(function(x){ return x.content === p.content; })){
        mine.push(p); added++;
      } else { dup++; }
    });
    Store.set('prompts_mine', mine);
    renderPage('prompt');
    toast('📥 ' + (LANG==='zh'?'导入成功：':'Imported: ') + added + ' ' + (LANG==='zh'?'条':'items') + (dup ? (' (' + dup + ' ' + (LANG==='zh'?'重复已跳过':'skipped')) + ')' : ''));
  };
  reader.readAsText(f, 'UTF-8');
  // 清空 input 让同文件可以重新选
  e.target.value = '';
}

/* ========== TTS 语音朗读（浏览器内置，离线可用） ========== */
function speakText(text){
  if(!text || !text.trim()) return toast(LANG==='zh'?'没有内容可朗读':'Nothing to speak');
  if(typeof speechSynthesis === 'undefined') return toast(LANG==='zh'?'当前浏览器不支持语音':'TTS not supported');
  speechSynthesis.cancel();
  const u = new SpeechSynthesisUtterance(text);
  u.lang = 'en-US';
  u.rate = 0.9;
  u.pitch = 1;
  const voices = speechSynthesis.getVoices();
  const enVoice = voices.find(v=>v.lang.startsWith('en'));
  if(enVoice) u.voice = enVoice;
  speechSynthesis.speak(u);
  toast('🔊 ' + (LANG==='zh'?'朗读中...':'Speaking...'));
}
function speakAllSentences(){
  const allSents = [...DEFAULT_SENTENCES, ...Store.get('customSentences',[])];
  if(!allSents.length) return toast(LANG==='zh'?'没有句子':'No sentences');
  speechSynthesis.cancel();
  let delay = 0;
  allSents.slice(0, 5).forEach((s, i) => {
    setTimeout(() => speakText(s), delay);
    delay += (s.length * 80) + 800;
  });
}
